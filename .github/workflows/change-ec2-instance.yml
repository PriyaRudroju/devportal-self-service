name: Provision EC2 Instance

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "EC2 instance name tag"
        required: true
        type: string

      instance_type:
        description: "EC2 instance type"
        required: true
        type: string

      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

      run_id:
        description: "Port workflow run id"
        required: false
        type: string

      requested_by:
        description: "Requested by"
        required: false
        type: string


env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}


jobs:

  terraform:

    runs-on: ubuntu-latest

    environment: >-
      ${{
        inputs.environment == 'prod' && 'production' ||
        inputs.environment == 'dev' && 'development' ||
        inputs.environment
      }}


    steps:

      - uses: actions/checkout@v4


      - name: Load environment config
        id: env_config
        run: |
          source scripts/load_env_config.sh "${{ inputs.environment }}"
          echo "tfc_ec2_dir=${TFC_EC2_DIR}" >> "$GITHUB_OUTPUT"


      - name: Log Inputs
        run: |
          echo "Instance: ${{ inputs.instance_name }}"
          echo "Type: ${{ inputs.instance_type }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Run ID: ${{ inputs.run_id }}"


      # -------------------------------
      # Port RUN START
      # -------------------------------

      - name: Report start to Port
        if: inputs.run_id != ''
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: PATCH_RUN
          runId: ${{ inputs.run_id }}
          summary: "Starting EC2 provisioning"


      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}


      - name: Terraform Init
        working-directory: ${{ steps.env_config.outputs.tfc_ec2_dir }}
        run: terraform init


      - name: Terraform Plan
        id: plan
        working-directory: ${{ steps.env_config.outputs.tfc_ec2_dir }}
        run: |
          terraform plan \
          -var="instance_name=${{ inputs.instance_name }}" \
          -var="instance_type=${{ inputs.instance_type }}" \
          -out=tfplan


      - name: Terraform Apply
        working-directory: ${{ steps.env_config.outputs.tfc_ec2_dir }}
        run: |
          terraform apply -auto-approve tfplan


      - name: Capture Terraform Outputs
        id: tf_outputs
        working-directory: ${{ steps.env_config.outputs.tfc_ec2_dir }}
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT



      # -------------------------------
      # UPDATE PORT ENTITY
      # -------------------------------

      - name: Update EC2 Catalog Entity
        if: success()
        uses: port-labs/port-github-action@v1
        with:

          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}

          operation: UPSERT

          blueprint: ec2ChangeRequest

          identifier: ${{ inputs.run_id }}

          title: EC2 ${{ inputs.instance_name }}

          properties: |
            {
              "instanceName": "${{ inputs.instance_name }}",
              "instanceType": "${{ inputs.instance_type }}",
              "environment": "${{ inputs.environment }}",
              "approvalStatus": "approved",
              "executionStatus": "completed",
              "requestedBy": "${{ inputs.requested_by }}"
            }



      # -------------------------------
      # PORT SUCCESS
      # -------------------------------


      - name: Report Success
        if: success()
        uses: port-labs/port-github-action@v1

        with:

          clientId: ${{ secrets.PORT_CLIENT_ID }}

          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}

          operation: PATCH_RUN

          runId: ${{ inputs.run_id }}

          status: SUCCESS

          summary: |
            EC2 ${{ inputs.instance_name }} provisioned successfully



      # -------------------------------
      # FAILURE
      # -------------------------------


      - name: Report Failure
        if: failure()

        uses: port-labs/port-github-action@v1

        with:

          clientId: ${{ secrets.PORT_CLIENT_ID }}

          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}

          operation: PATCH_RUN

          runId: ${{ inputs.run_id }}

          status: FAILURE

          summary: |
            EC2 provisioning failed
