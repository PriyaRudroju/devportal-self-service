name: Provision S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "S3 bucket name"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
      port_run_id:
        description: "Port catalog entity identifier (workflow run id from Port dispatch)"
        required: true
        type: string

env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Log inputs
        run: |
          echo "Git ref: ${GITHUB_REF}"
          echo "Bucket name: ${{ inputs.bucket_name }}"
          echo "Terraform environment: ${{ inputs.environment }}"
          echo "Port entity id: ${{ inputs.port_run_id }}"

      - name: Validate Port entity id
        run: |
          if [ -z "${{ inputs.port_run_id }}" ]; then
            echo "port_run_id is required" >&2
            exit 1
          fi

      - name: Link GitHub run to Port catalog
        continue-on-error: true
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          blueprint: s3Bucket
          identifier: ${{ inputs.port_run_id }}
          properties: |
            {
              "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "gitRef": "${{ github.ref_name }}"
            }

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -var="bucket_name=${{ inputs.bucket_name }}" \
            -out=tfplan \
            -detailed-exitcode

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan

      - name: Report success to Port catalog
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          blueprint: s3Bucket
          identifier: ${{ inputs.port_run_id }}
          properties: |
            {
              "bucketName": "${{ inputs.bucket_name }}",
              "environment": "${{ inputs.environment }}",
              "status": "provisioned",
              "region": "us-east-1",
              "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Report failure to Port catalog
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          blueprint: s3Bucket
          identifier: ${{ inputs.port_run_id }}
          properties: |
            {
              "bucketName": "${{ inputs.bucket_name }}",
              "environment": "${{ inputs.environment }}",
              "status": "failed",
              "region": "us-east-1",
              "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
