name: Provision S3 Bucket

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "S3 bucket name"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
      port_run_id:
        description: "Port workflow run ID (from catalog entity portRunId)"
        required: true
        type: string

env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Log inputs
        run: |
          echo "Git ref: ${GITHUB_REF}"
          echo "Bucket name: ${{ inputs.bucket_name }}"
          echo "Terraform environment: ${{ inputs.environment }}"
          echo "Port run ID: ${{ inputs.port_run_id }}"

      - name: Validate Port run ID
        run: |
          if [ -z "${{ inputs.port_run_id }}" ]; then
            echo "port_run_id is required" >&2
            exit 1
          fi

      - name: Report start to Port
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          summary: "Starting S3 bucket provisioning for ${{ inputs.bucket_name }} (ref ${GITHUB_REF})"

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan \
            -var="bucket_name=${{ inputs.bucket_name }}" \
            -out=tfplan \
            -detailed-exitcode

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan

      - name: Report success to Port
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          blueprint: s3Bucket
          identifier: ${{ inputs.port_run_id }}
          properties: |
            {
              "bucketName": "${{ inputs.bucket_name }}",
              "environment": "${{ inputs.environment }}",
              "status": "provisioned",
              "region": "us-east-1"
            }

      - name: Log success to Port
        if: success()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          summary: "S3 bucket ${{ inputs.bucket_name }} provisioned successfully in ${{ inputs.environment }}"
          status: "SUCCESS"

      - name: Report failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: UPSERT
          blueprint: s3Bucket
          identifier: ${{ inputs.port_run_id }}
          properties: |
            {
              "bucketName": "${{ inputs.bucket_name }}",
              "environment": "${{ inputs.environment }}",
              "status": "failed",
              "region": "us-east-1"
            }

      - name: Log failure to Port
        if: failure()
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          summary: "S3 bucket provisioning failed for ${{ inputs.bucket_name }} in ${{ inputs.environment }}"
