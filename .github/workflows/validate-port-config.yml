name: Validate Port Config

on:
  pull_request:
    branches: [main]
    paths:
      - "port/**"
      - "scripts/apply_port_config.py"
      - "scripts/load_env_config.sh"
      - ".github/workflows/validate-port-config.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load config defaults for prod
        run: source scripts/load_env_config.sh prod

      - name: Plan Port config for prod
        env:
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: python scripts/apply_port_config.py --env prod --plan --github-mode legacy
