name: Validate Port Config

on:
  pull_request:
    branches: [qa]
    paths:
      - "port/**"
      - "scripts/apply_port_config.py"
      - "scripts/load_env_config.sh"
      - ".github/workflows/validate-port-config.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Load config defaults for qa
        run: source scripts/load_env_config.sh qa

      - name: Plan Port config for qa
        env:
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: python scripts/apply_port_config.py --env qa --plan --github-mode legacy
