name: Validate Port Config

on:
  pull_request:
    branches: [dev]
    paths:
      - "port/**"
      - "lambda/**"
      - "scripts/apply_port_config.py"
      - "scripts/load_env_config.sh"
      - "scripts/test_*.py"
      - ".github/workflows/validate-port-config.yml"
      - ".github/workflows/deploy-port-config.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Load config defaults for dev
        run: source scripts/load_env_config.sh dev

      - name: Plan Port config for dev
        env:
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: python scripts/apply_port_config.py --env dev --plan --github-mode legacy

      - name: Verify S3 automation GitHub ref template
        run: python scripts/verify_s3_github_ref.py

      - name: Unit test Port config helpers
        run: python scripts/test_apply_port_config.py

      - name: Unit test Lambda handlers
        run: |
          python scripts/test_lambda_s3_validate.py
          python scripts/test_lambda_servicenow.py
