name: Validate Port Config

on:
  pull_request:
    branches: [dev]
    paths:
      - "port/**"
      - "scripts/apply_port_config.py"
      - "scripts/load_env_config.sh"
      - ".github/workflows/validate-port-config.yml"
      - ".github/workflows/deploy-port-config.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Load config defaults for dev
        run: source scripts/load_env_config.sh dev

      - name: Plan Port config for dev
        env:
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: python scripts/apply_port_config.py --env dev --plan --github-mode legacy
