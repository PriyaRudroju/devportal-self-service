name: Promote Port Config

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to apply to Port"
        required: true
        type: choice
        options:
          - qa
          - prod
      skip_legacy:
        description: "Skip legacy actions/automations (workflows only)"
        required: false
        type: boolean
        default: true
      github_integration_mode:
        description: "GitHub integration mode (legacy=Sunset, ocean=GitHub Ocean)"
        required: false
        type: choice
        options:
          - legacy
          - ocean
        default: legacy

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env == 'prod' && 'production' || 'qa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Load environment config defaults
        run: |
          source scripts/load_env_config.sh "${{ inputs.target_env }}"
          echo "TFC_WORKSPACE=${TFC_WORKSPACE:-}" >> "$GITHUB_ENV"
          echo "API_GATEWAY_URL=${API_GATEWAY_URL:-}" >> "$GITHUB_ENV"
          echo "GITHUB_INTEGRATION_MODE=${GITHUB_INTEGRATION_MODE:-legacy}" >> "$GITHUB_ENV"
          if [ "${{ inputs.github_integration_mode }}" = "ocean" ]; then
            echo "GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID:-}" >> "$GITHUB_ENV"
          fi

      - name: Apply Port configuration to ${{ inputs.target_env }}
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          GITHUB_INSTALLATION_ID: ${{ vars.GITHUB_INSTALLATION_ID }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
          GITHUB_ORG: PriyaRudroju
          GITHUB_REPO: devportal-self-service
          AWS_REGION: us-east-2
        run: |
          ARGS="--env ${{ inputs.target_env }} --github-mode ${{ inputs.github_integration_mode }}"
          if [ "${{ inputs.skip_legacy }}" = "true" ]; then
            ARGS="$ARGS --skip-legacy"
          fi
          python scripts/apply_port_config.py $ARGS

      - name: Summary
        run: |
          echo "Promoted Port config for: ${{ inputs.target_env }}"
          echo "GitHub mode: ${{ inputs.github_integration_mode }}"
          echo "TFC workspace: ${TFC_WORKSPACE:-not set}"
          echo "API Gateway: ${API_GATEWAY_URL:-not set}"
