name: Deploy Port Config

on:
  push:
    branches: [dev, "feature/**"]
    paths:
      - "port/**"
      - "scripts/apply_port_config.py"
      - "scripts/load_env_config.sh"
      - ".github/workflows/deploy-port-config.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Load environment config defaults
        run: |
          source scripts/load_env_config.sh dev
          echo "TFC_WORKSPACE=${TFC_WORKSPACE:-}" >> "$GITHUB_ENV"
          echo "API_GATEWAY_URL=${API_GATEWAY_URL:-}" >> "$GITHUB_ENV"
          echo "GITHUB_INTEGRATION_MODE=${GITHUB_INTEGRATION_MODE:-legacy}" >> "$GITHUB_ENV"

      - name: Verify S3 automation GitHub ref template (repo)
        run: python scripts/verify_s3_github_ref.py

      - name: Apply Port configuration
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          GITHUB_INSTALLATION_ID: ${{ vars.GITHUB_INSTALLATION_ID }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
          GITHUB_ORG: PriyaRudroju
          GITHUB_REPO: devportal-self-service
          AWS_REGION: us-east-2
        run: python scripts/apply_port_config.py --env dev --github-mode legacy

      - name: Verify live Port automation GitHub ref
        continue-on-error: true
        id: verify_live
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
        run: python scripts/verify_s3_github_ref.py --check-live

      - name: Warn if live Port ref could not be verified
        if: steps.verify_live.outcome != 'success'
        run: |
          echo "::warning::Live Port automation ref could not be verified via GET API — apply step succeeded; E2E will validate dispatch."

      - name: Summary
        run: |
          echo "Applied Port config for: dev (branch ${GITHUB_REF_NAME})"
          echo "GIT_REF_DEFAULT: ${GIT_REF_DEFAULT:-dev}"
          echo "TFC workspace: ${TFC_WORKSPACE:-not set}"
          echo "API Gateway: ${API_GATEWAY_URL:-not set}"
