name: Test S3 Port E2E

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git branch for Port form git_ref and GitHub dispatch
        required: true
        default: feature/s3-git-ref-test
        type: string
      bucket_name:
        description: S3 bucket name (leave empty for auto-generated)
        required: false
        type: string
  push:
    branches: [feature/s3-git-ref-test]
    paths:
      - ".github/workflows/test-s3-port-e2e.yml"
      - "scripts/test_s3_port_e2e.py"
      - "scripts/verify_s3_github_ref.py"
      - "scripts/apply_port_config.py"
      - "port/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify S3 automation GitHub ref template (repo)
        run: python scripts/verify_s3_github_ref.py

      - name: Apply latest Port config
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
          API_GATEWAY_URL: ${{ vars.API_GATEWAY_URL }}
          GITHUB_INSTALLATION_ID: ${{ vars.GITHUB_INSTALLATION_ID }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
          GITHUB_ORG: PriyaRudroju
          GITHUB_REPO: devportal-self-service
          AWS_REGION: us-east-2
          FEATURE_GIT_REFS: feature/s3-git-ref-test
        run: python scripts/apply_port_config.py --env dev --github-mode legacy

      - name: Verify live Port automation GitHub ref
        continue-on-error: true
        id: verify_live
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
        run: python scripts/verify_s3_github_ref.py --check-live

      - name: Warn if live Port ref could not be verified
        if: steps.verify_live.outcome != 'success'
        run: |
          echo "::warning::Live Port automation ref could not be verified via GET API — apply step succeeded; E2E will validate dispatch."

      - name: Verify GitHub workflow accepts dispatch on feature branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REF: ${{ github.event.inputs.git_ref || 'feature/s3-git-ref-test' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          ref = os.environ["GIT_REF"]
          org = "PriyaRudroju"
          repo = "devportal-self-service"
          url = f"https://api.github.com/repos/{org}/{repo}/actions/workflows/provision-s3-bucket.yml/dispatches"
          body = json.dumps({
              "ref": ref,
              "inputs": {
                  "bucket_name": "devportal-dispatch-sanity-check",
                  "environment": "dev",
                  "port_run_id": "dispatch-sanity-check",
              },
          }).encode()
          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print(f"GitHub dispatch accepted: HTTP {resp.status} ref={ref}")
          PY

      - name: Run S3 Port E2E test
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_URL: https://api.port.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: PriyaRudroju
          GITHUB_REPO: devportal-self-service
          GIT_REF: ${{ github.event.inputs.git_ref || 'feature/s3-git-ref-test' }}
          BUCKET_NAME: ${{ github.event.inputs.bucket_name }}
        run: python scripts/test_s3_port_e2e.py

      - name: Print debug log on failure
        if: failure()
        run: |
          if [ -f debug-985163.log ]; then
            echo "=== debug-985163.log ==="
            cat debug-985163.log
          else
            echo "No debug log file found"
          fi

      - name: Summary
        if: always()
        run: |
          echo "E2E test finished. Check step logs above for Port run URL and GitHub Actions run URL."
