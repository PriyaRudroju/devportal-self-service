<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BannerHealth Home preview (sample data)</title>
  <style>
:root {
  --bg: #f6f7f9;
  --card: #fff;
  --text: #17181c;
  --muted: #6b7280;
  --line: #eceef2;
  --blue: #2f6bff;
  --green: #067a57;
  --amber: #b45309;
  --red: #c52626;
  --rail: #2b2f36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}
.shell {
  display: grid;
  grid-template-columns: 48px 268px 1fr;
  min-height: 100vh;
}
.rail {
  background: var(--rail);
  color: #d7dbe2;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 16px;
  gap: 4px;
}
.rail-btn {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  cursor: default;
  font-size: 14px;
  position: relative;
}
.rail-btn.active { background: #fff; color: #111; }
.rail-spacer { flex: 1; }
.bell span {
  position: absolute;
  top: -4px;
  right: -6px;
  background: #e11d48;
  color: #fff;
  font-size: 8px;
  font-weight: 700;
  padding: 1px 3px;
  border-radius: 8px;
}
.avatar {
  background: #ea580c;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
}
.sidebar {
  background: #fff;
  border-right: 1px solid var(--line);
  padding: 12px 10px 32px;
  overflow: auto;
}
.org-switch {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 650;
  font-size: 13px;
  margin-bottom: 10px;
}
.org-switch select {
  border: 0;
  font-weight: 650;
  font-size: 13px;
  width: 100%;
  background: transparent;
  cursor: pointer;
}
.org-caret { color: var(--muted); font-size: 11px; }
.search {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  background: #fafbfc;
  margin-bottom: 10px;
}
.search.wide { max-width: 380px; margin: 0; }
.nav-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 650;
  margin: 14px 6px 6px;
  display: flex;
  justify-content: space-between;
}
.nav-tools { font-weight: 500; }
.nav, summary {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 7px 8px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.nav.home.active, .nav.active, .nav:hover, summary:hover { background: #eaf0ff; color: #1d4ed8; }
.nav.nested { padding-left: 22px; font-size: 12px; color: #374151; }
.nav.muted { color: var(--muted); }
details { margin: 2px 0; }
summary {
  list-style: none;
  font-size: 13px;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; color: var(--muted); }
details[open] > summary::before { content: "▾ "; }
main { padding: 16px 24px 56px; overflow: auto; }
.sample-banner {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 14px;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
}
.top h1 { font-size: 26px; font-weight: 650; margin: 0; letter-spacing: -0.03em; }
.quick-links, .kpis, .pies { margin-bottom: 14px; }
.actions-and-viewed {
  display: grid;
  grid-template-columns: 2fr 3fr;
  gap: 12px;
  margin-bottom: 14px;
  align-items: start;
}
.actions, .recent { margin-bottom: 0; }
.recent .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.recent .row:last-child { border-bottom: 0; }
.recent .type { color: var(--muted); font-size: 12px; white-space: nowrap; }
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 13px;
  color: #1d4ed8;
  font-weight: 600;
  cursor: pointer;
}
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi, .card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.kpi { padding: 14px 16px; border-top: 3px solid #c9d4e8; }
.kpi.warn { border-top-color: #f59e0b; }
.kpi.bad { border-top-color: #ef4444; }
.kpi.good { border-top-color: #10b981; }
.kpi.info { border-top-color: var(--blue); }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
.kpi .value { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -0.04em; }
.pies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card h3 { margin: 0; font-size: 13px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card .sub { font-size: 11px; color: var(--muted); font-weight: 500; margin: 0; padding: 0 14px 10px; border-bottom: 1px solid var(--line); }
.card-b { padding: 14px; }
.pie-wrap { display: flex; align-items: center; gap: 16px; }
.pie { width: 112px; height: 112px; border-radius: 50%; flex: 0 0 auto; }
.legend { font-size: 12px; display: grid; gap: 6px; }
.swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.action-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 0;
  background: var(--blue);
  color: #fff;
  border-radius: 8px;
  padding: 9px 12px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.tables-stack { display: grid; gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 11px; }
.badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650; }
.ok { background: #e4f7ee; color: var(--green); }
.warn { background: #fff4df; color: var(--amber); }
.bad { background: #fde8e8; color: var(--red); }
.info { background: #eaf0ff; color: #1d4ed8; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
@media (max-width: 1200px) {
  .kpis, .pies { grid-template-columns: 1fr 1fr; }
  .actions-and-viewed { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { display: none; }
  .kpis, .pies, .actions-and-viewed { grid-template-columns: 1fr; }
}

  </style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Port modules">
      <button class="rail-btn" title="Search">⌕</button>
      <button class="rail-btn" title="Catalog">◇</button>
      <button class="rail-btn active" title="Home">▦</button>
      <button class="rail-btn" title="Self-service">⚡</button>
      <button class="rail-btn" title="Data">💧</button>
      <button class="rail-btn" title="Builder">☰</button>
      <button class="rail-btn" title="AI">✦</button>
      <button class="rail-btn" title="Security">🛡</button>
      <span class="rail-spacer"></span>
      <button class="rail-btn bell" title="Notifications">🔔<span>9+</span></button>
      <button class="rail-btn avatar" title="You">VI</button>
    </nav>

    <aside class="sidebar">
      <label class="org-switch">
        <span class="org-caret">▾</span>
        <select id="orgSwitch" aria-label="Port organization">
          <option value="dev">BannerHealth - Dev</option>
          <option value="qa">BannerHealth - QA</option>
          <option value="prod">BannerHealth - Prod</option>
        </select>
      </label>
      <input class="search" placeholder="Search pages" />

      <button class="nav home active">Home</button>

      <div class="nav-label">
        Organization
        <span class="nav-tools">▾ +</span>
      </div>

      <details open>
        <summary>Manage service catalog</summary>
        <button class="nav nested">Services</button>
        <button class="nav nested">Workloads</button>
        <button class="nav nested">Set up automatic discovery</button>
      </details>
      <details>
        <summary>Manage users and teams</summary>
        <button class="nav nested">Users</button>
        <button class="nav nested">Environments</button>
        <button class="nav nested">Teams</button>
        <button class="nav nested">Groups</button>
      </details>
      <button class="nav">Plan my day</button>
      <button class="nav">Manage my team's work</button>
      <button class="nav">Manage incidents</button>
      <button class="nav">Comply with standards</button>
      <button class="nav">AI Invocations</button>
      <button class="nav">AI Agents</button>
      <details>
        <summary>Manage scorecards</summary>
        <button class="nav nested">Scorecards</button>
        <button class="nav nested">Scorecard rules</button>
        <button class="nav nested">Scorecard rule results</button>
      </details>
      <details>
        <summary>Catalog tables</summary>
        <button class="nav nested" data-table="jira">Self-Service Feedback</button>
        <button class="nav nested">Deployments</button>
        <button class="nav nested" data-table="runs">GitHub Workflow Runs</button>
        <button class="nav nested">GitHub Workflows</button>
        <button class="nav nested" data-table="ec2">Self Service Infra Resources</button>
        <button class="nav nested">AWS AMIs</button>
        <button class="nav nested">AWS Security Groups</button>
        <button class="nav nested">AWS Subnets</button>
        <button class="nav nested" data-table="ec2">Terraform-managed EC2</button>
        <button class="nav nested">Classic Load Balancers</button>
        <button class="nav nested">AWS KMS Keys</button>
        <button class="nav nested">Jira Teams</button>
      </details>

      <div class="nav-label">Private</div>
      <button class="nav muted">+ Add your private page</button>
    </aside>

    <main>
      <div class="sample-banner">
        Sample data only — not live BannerHealth. After the pies: Quick Actions + Recently viewed only. No Provisioned EC2/S3, failed-run, or Jira tables.
      </div>
      <header class="top">
        <h1 id="greeting">Good afternoon</h1>
        <input class="search wide" id="globalSearch" placeholder="Search" />
      </header>

      <section class="quick-links" id="quickLinks"></section>
      <section class="kpis" id="kpis"></section>
      <section class="pies" id="pies"></section>
      <section class="actions-and-viewed" id="actionsAndViewed">
        <section class="actions" id="actions"></section>
        <section class="recent" id="recentlyViewed"></section>
      </section>
    </main>
  </div>
  <script>
const DATA = {
  user: "Vishwak",
  infra: [
    { resource: "ec2", resource_name: "idp-demo-bastion", aws_region: "us-west-2", environment: "dev", requestor: "priya", provisioning_status: "provisioned", created_at: "2026-09-08 09:14" },
    { resource: "ec2", resource_name: "claims-worker-qa", aws_region: "us-east-1", environment: "qa", requestor: "alex", provisioning_status: "provisioned", created_at: "2026-09-08 11:02" },
    { resource: "ec2", resource_name: "patient-cache-dev", aws_region: "us-west-2", environment: "dev", requestor: "alex", provisioning_status: "provisioned", created_at: "2026-09-07 16:40" },
    { resource: "ec2", resource_name: "analytics-scratch", aws_region: "us-east-1", environment: "dev", requestor: "jordan", provisioning_status: "pending", created_at: "2026-09-06 08:21" },
    { resource: "ec2", resource_name: "tfc-runner-prod", aws_region: "us-west-2", environment: "prod", requestor: "priya", provisioning_status: "failed", created_at: "2026-09-05 13:55" },
    { resource: "s3", resource_name: "bh-idp-artifacts-dev", aws_region: "us-west-2", environment: "dev", requestor: "priya", provisioning_status: "provisioned", created_at: "2026-09-07 14:03" },
    { resource: "s3", resource_name: "bh-claims-logs-qa", aws_region: "us-east-1", environment: "qa", requestor: "alex", provisioning_status: "provisioned", created_at: "2026-09-08 10:18" },
    { resource: "s3", resource_name: "bh-analytics-raw-prod", aws_region: "us-east-1", environment: "prod", requestor: "jordan", provisioning_status: "pending", created_at: "2026-09-04 09:47" },
    { resource: "s3", resource_name: "bh-app-backups-dev", aws_region: "us-west-2", environment: "dev", requestor: "alex", provisioning_status: "failed", created_at: "2026-09-03 17:12" },
  ],
  runs: [
    { name: "change-ec2-instance.yml #1024", conclusion: "success", status: "completed", createdAt: "2026-09-08 12:01", link: "github.com/BHGitOps/…" },
    { name: "change-ec2-instance.yml #1041", conclusion: "in_progress", status: "queued", createdAt: "2026-09-08 12:22", link: "github.com/BHGitOps/…" },
    { name: "change-ec2-instance.yml #998", conclusion: "success", status: "completed", createdAt: "2026-09-07 18:44", link: "github.com/BHGitOps/…" },
    { name: "provision-s3-bucket.yml #1033", conclusion: "failure", status: "completed", createdAt: "2026-09-08 08:19", link: "github.com/BHGitOps/…" },
    { name: "provision-s3-bucket.yml #1011", conclusion: "success", status: "completed", createdAt: "2026-09-06 15:02", link: "github.com/BHGitOps/…" },
    { name: "terraform-plan.yml #880", conclusion: "failure", status: "completed", createdAt: "2026-09-05 11:36", link: "github.com/BHGitOps/…" },
  ],
  jira: [
    { key: "IDP-73182", issueType: "Story", priority: "High", status: "Done", assignee: "Priya", updated: "2026-09-08" },
    { key: "IDP-73201", issueType: "Task", priority: "Medium", status: "In Progress", assignee: "Alex", updated: "2026-09-08" },
    { key: "IDP-73218", issueType: "Story", priority: "Low", status: "To Do", assignee: "Jordan", updated: "2026-09-07" },
    { key: "IDP-73190", issueType: "Bug", priority: "High", status: "Done", assignee: "Alex", updated: "2026-09-07" },
    { key: "IDP-73155", issueType: "Task", priority: "Medium", status: "Done", assignee: "Priya", updated: "2026-09-06" },
  ],
};

const COLORS = {
  provisioned: "#10b981",
  pending: "#f59e0b",
  failed: "#ef4444",
  failure: "#ef4444",
  success: "#10b981",
  in_progress: "#2f6bff",
  Done: "#10b981",
};

function hourGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

function query() {
  return (document.getElementById("globalSearch").value || "").toLowerCase();
}

function match(row) {
  const q = query();
  if (!q) return true;
  return JSON.stringify(row).toLowerCase().includes(q);
}

function counts(list, key) {
  const out = {};
  list.forEach((item) => {
    out[item[key]] = (out[item[key]] || 0) + 1;
  });
  return out;
}

function pie(countsMap) {
  if (!Object.keys(countsMap).length) {
    return `<div class="empty">No data for this widget</div>`;
  }
  const total = Object.values(countsMap).reduce((a, b) => a + b, 0) || 1;
  let angle = 0;
  const stops = [];
  Object.entries(countsMap).forEach(([label, n]) => {
    const next = angle + (n / total) * 360;
    stops.push(`${COLORS[label] || "#cbd5e1"} ${angle}deg ${next}deg`);
    angle = next;
  });
  const legend = Object.entries(countsMap)
    .map(
      ([label, n]) =>
        `<div><span class="swatch" style="background:${COLORS[label] || "#cbd5e1"}"></span>${label} · ${n}</div>`
    )
    .join("");
  return `<div class="pie-wrap"><div class="pie" style="background:conic-gradient(${stops.join(",")})"></div><div class="legend">${legend}</div></div>`;
}

function render() {
  const org = document.getElementById("orgSwitch").value;
  const orgLabel = { dev: "Dev", qa: "QA", prod: "Prod" }[org];
  document.getElementById("greeting").textContent = `${hourGreeting()}, ${DATA.user}  ·  ${orgLabel} preview`;

  const infra = DATA.infra.filter(match);
  const runs = DATA.runs.filter(match);
  const jira = DATA.jira.filter(match);
  const ec2 = infra.filter((r) => r.resource === "ec2");
  const s3 = infra.filter((r) => r.resource === "s3");
  const provisionedEc2 = ec2.filter((r) => r.provisioning_status === "provisioned");
  const provisionedS3 = s3.filter((r) => r.provisioning_status === "provisioned");
  const failedRuns = runs.filter((r) => r.conclusion === "failure");
  const doneJira = jira.filter((r) => r.status === "Done");

  document.getElementById("quickLinks").innerHTML = `
    <article class="card">
      <h3>Quick view</h3>
      <div class="card-b quick-chips">
        <button class="chip">Self-service hub</button>
        <button class="chip">Self Service Infra Resources</button>
        <button class="chip">GitHub Workflow Runs</button>
        <button class="chip">Users and teams</button>
      </div>
    </article>`;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi good">
      <div class="label">Provisioned EC2</div>
      <div class="hint">Active instances · resource = ec2</div>
      <div class="value">${provisionedEc2.length}</div>
    </div>
    <div class="kpi good">
      <div class="label">Provisioned S3</div>
      <div class="hint">Active buckets · resource = s3</div>
      <div class="value">${provisionedS3.length}</div>
    </div>
    <div class="kpi bad">
      <div class="label">Failed Workflow Runs</div>
      <div class="hint">conclusion = failure</div>
      <div class="value">${failedRuns.length}</div>
    </div>
    <div class="kpi info">
      <div class="label">Completed Tasks</div>
      <div class="hint">Jira status = Done</div>
      <div class="value">${doneJira.length}</div>
    </div>`;

  document.getElementById("pies").innerHTML = `
    <article class="card">
      <h3>EC2 by Status</h3>
      <p class="sub">Distribution of all EC2 resources</p>
      <div class="card-b">${pie(counts(ec2, "provisioning_status"))}</div>
    </article>
    <article class="card">
      <h3>S3 by Status</h3>
      <p class="sub">Distribution of all S3 resources</p>
      <div class="card-b">${pie(counts(s3, "provisioning_status"))}</div>
    </article>
    <article class="card">
      <h3>Workflow Runs by Conclusion</h3>
      <p class="sub">Distribution of run conclusions</p>
      <div class="card-b">${pie(counts(runs, "conclusion"))}</div>
    </article>`;

  document.getElementById("actions").innerHTML = `
    <article class="card">
      <h3>Quick Actions</h3>
      <p class="sub">Create EC2, Create S3, Submit Feedback</p>
      <div class="card-b action-row">
        <button class="btn">Create EC2 Instance</button>
        <button class="btn">Create S3 Bucket</button>
        <button class="btn">Submit Feedback</button>
      </div>
    </article>`;

  document.getElementById("recentlyViewed").innerHTML = `
    <article class="card" id="table-viewed">
      <h3>Recently viewed entities</h3>
      <p class="sub">Sample rows — live Port shows each user’s own history</p>
      <div class="card-b">
        <div class="row"><span>idp-demo-bastion</span><span class="type">Self Service Infra Resources</span></div>
        <div class="row"><span>bh-idp-artifacts-dev</span><span class="type">Self Service Infra Resources</span></div>
        <div class="row"><span>change-ec2-instance.yml #1024</span><span class="type">GitHub Workflow Run</span></div>
        <div class="row"><span>IDP-73182</span><span class="type">Jira Issue</span></div>
        <div class="row"><span>S3 Bucket Provisioning</span><span class="type">Service Offering</span></div>
      </div>
    </article>`;
}

document.getElementById("orgSwitch").onchange = render;
document.getElementById("globalSearch").oninput = render;
render();

  </script>
</body>
</html>
